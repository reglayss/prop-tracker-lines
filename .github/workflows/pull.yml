name: Pull lines
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pull-lines
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: .cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      - run: node runner.js
        env:
          PROPLINE_KEY: ${{ secrets.PROPLINE_KEY }}
          KASHROCK_KEY: ${{ secrets.KASHROCK_KEY }}
      - run: node model.js
        continue-on-error: true
        timeout-minutes: 8
      - run: |
          git config user.name "prop-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lines.json pl_rows.json state.json
          git add model.json tracker.json calib.json calib_pending.json 2>/dev/null || true
          git commit -m "lines $(date -u +%H:%M)" || exit 0
          git pull --rebase -X theirs || true
          git push
